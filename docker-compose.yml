version: '3.9'

services:
  # ──────────────────────────────────────────
  # MongoDB
  # ──────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: splitstay-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # Backend (Node/Express)
  # ──────────────────────────────────────────
  backend:
    build:
      context: ./splitstay/backend
      dockerfile: Dockerfile
    container_name: splitstay-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '5000:5000'
    env_file:
      - ./splitstay/backend/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/splitstay
      - NODE_ENV=production
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:5000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3

  # ──────────────────────────────────────────
  # Frontend (React/Vite → nginx)
  # ──────────────────────────────────────────
  frontend:
    build:
      context: ./splitstay/frontend
      dockerfile: Dockerfile
    container_name: splitstay-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '80:80'

volumes:
  mongo_data:
    driver: local

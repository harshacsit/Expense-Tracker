<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle -->
  <rect width="512" height="512" rx="128" fill="#0c0d19" />
  <circle cx="256" cy="256" r="180" fill="url(#grad)" opacity="0.15" />
  <!-- Stylized House with Split Beam -->
  <path d="M256 96 L400 224 L352 224 L352 384 L160 384 L160 224 L112 224 Z" fill="none" stroke="url(#grad)" stroke-width="28" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)" />
  <!-- Dividing Energy Bolt -->
  <path d="M272 192 L224 288 L288 288 L240 384" fill="none" stroke="#38BDF8" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
</svg>

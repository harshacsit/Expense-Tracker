name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ──────────────────────────────────────────
  # Backend — lint + unit tests
  # ──────────────────────────────────────────
  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: splitstay/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: splitstay/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest unit tests
        run: npm test -- --ci --forceExit --coverage
        env:
          NODE_ENV: test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: splitstay/backend/coverage/

  # ──────────────────────────────────────────
  # Frontend — build check
  # ──────────────────────────────────────────
  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: splitstay/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: splitstay/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000

  # ──────────────────────────────────────────
  # Docker — build images (validates Dockerfiles)
  # ──────────────────────────────────────────
  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./splitstay/backend
          file: ./splitstay/backend/Dockerfile
          push: false
          tags: splitstay-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./splitstay/frontend
          file: ./splitstay/frontend/Dockerfile
          push: false
          tags: splitstay-frontend:ci
